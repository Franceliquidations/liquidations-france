name: 🤖 Collecte automatique BODACC

on:
  # Tourne chaque nuit à 2h du matin (heure Paris)
  schedule:
    - cron: '0 1 * * *'
  
  # Permet de lancer manuellement depuis GitHub
  workflow_dispatch:

jobs:
  collecter:
    name: Interroger BODACC et mettre à jour la base
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ⚙️ Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Installer les dépendances
        run: npm install
        working-directory: ./src

      - name: 🚀 Lancer la collecte BODACC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node collecteur.js
        working-directory: ./src

      - name: ✅ Collecte terminée
        run: echo "Base de données mise à jour avec succès !"
