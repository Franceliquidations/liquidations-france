<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>France Liquidations — Trouvez les meilleures affaires près de chez vous</title>
  <meta name="description" content="Répertoire des magasins en liquidation judiciaire en France. Données officielles BODACC, mises à jour chaque nuit." />

  <!-- Leaflet pour la carte -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bleu:    #185FA5;
      --rouge:   #C0392B;
      --vert:    #27AE60;
      --orange:  #E67E22;
      --bg:      #F8F9FA;
      --blanc:   #FFFFFF;
      --texte:   #1A1A2E;
      --gris:    #6B7280;
      --bordure: #E5E7EB;
      --radius:  10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--texte); }

    /* HEADER */
    header { background: var(--bleu); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .logo span { font-size: 1.5rem; }
    .badge-live { background: var(--vert); font-size: 11px; padding: 3px 8px; border-radius: 20px; font-weight: 600; animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.6} }

    /* STATS BANNER */
    .stats-banner { background: white; border-bottom: 1px solid var(--bordure); padding: .75rem 1.5rem; display: flex; gap: 2rem; flex-wrap: wrap; }
    .stat-item { display: flex; flex-direction: column; }
    .stat-item .val { font-size: 1.4rem; font-weight: 700; color: var(--bleu); line-height: 1; }
    .stat-item .lbl { font-size: 11px; color: var(--gris); margin-top: 2px; }
    .derniere-maj { margin-left: auto; font-size: 12px; color: var(--gris); align-self: center; }

    /* LAYOUT PRINCIPAL */
    .main { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 110px); }

    /* PANNEAU GAUCHE */
    .panel { background: white; border-right: 1px solid var(--bordure); display: flex; flex-direction: column; overflow: hidden; }
    .panel-header { padding: 1rem; border-bottom: 1px solid var(--bordure); }
    .search-bar { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-bar input { flex: 1; height: 36px; padding: 0 12px; border: 1px solid var(--bordure); border-radius: var(--radius); font-size: 13px; }
    .search-bar input:focus { outline: none; border-color: var(--bleu); }
    .filters { display: flex; gap: 8px; flex-wrap: wrap; }
    .filters select { height: 32px; padding: 0 8px; border: 1px solid var(--bordure); border-radius: var(--radius); font-size: 12px; background: var(--bg); }
    .results-count { font-size: 12px; color: var(--gris); margin-top: 8px; }

    /* LISTE */
    .liste { flex: 1; overflow-y: auto; }
    .card { padding: 12px 14px; border-bottom: 1px solid var(--bordure); cursor: pointer; transition: background .1s; }
    .card:hover { background: var(--bg); }
    .card.active { background: #EBF3FF; border-left: 3px solid var(--bleu); }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-nom { font-weight: 600; font-size: 14px; line-height: 1.3; }
    .badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .badge.liq  { background: #FDECEA; color: var(--rouge); }
    .badge.red  { background: #FEF3E2; color: var(--orange); }
    .badge.sauv { background: #E8F5E9; color: var(--vert); }
    .card-ville { font-size: 12px; color: var(--gris); margin-top: 4px; }
    .card-activite { font-size: 12px; color: #4B5563; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .card-date { font-size: 11px; color: var(--gris); }
    .etoiles { color: #F59E0B; font-size: 11px; letter-spacing: -1px; }

    /* CARTE */
    #carte { width: 100%; height: 100%; }

    /* POPUP CARTE */
    .popup-nom { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .popup-detail { font-size: 12px; color: #374151; line-height: 1.6; }
    .popup-link { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--bleu); text-decoration: none; }
    .popup-link:hover { text-decoration: underline; }

    /* CHARGEMENT */
    .loading { text-align: center; padding: 2rem; color: var(--gris); font-size: 14px; }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--bordure); border-top-color: var(--bleu); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* SIGNALEMENT */
    .btn-signaler { margin: 10px 14px; padding: 10px; background: var(--bleu); color: white; border: none; border-radius: var(--radius); font-size: 13px; cursor: pointer; width: calc(100% - 28px); font-weight: 500; }
    .btn-signaler:hover { opacity: .9; }

    /* MODAL SIGNALEMENT */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: white; border-radius: 14px; padding: 1.5rem; width: 90%; max-width: 480px; }
    .modal h3 { font-size: 16px; margin-bottom: 1rem; }
    .modal label { font-size: 13px; color: var(--gris); display: block; margin-bottom: 4px; margin-top: 10px; }
    .modal input, .modal textarea, .modal select { width: 100%; padding: 8px 12px; border: 1px solid var(--bordure); border-radius: 8px; font-size: 13px; font-family: inherit; }
    .modal textarea { height: 80px; resize: vertical; }
    .modal-btns { display: flex; gap: 8px; margin-top: 1rem; }
    .modal-btns button { flex: 1; height: 38px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-envoyer { background: var(--bleu); color: white; }
    .btn-annuler { background: var(--bg); color: var(--texte); border: 1px solid var(--bordure) !important; }

    @media (max-width: 768px) {
      .main { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; }
      .stats-banner { gap: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span>🏪</span> France Liquidations </div>
  <div class="badge-live">● LIVE</div>
</header>

<div class="stats-banner">
  <div class="stat-item"><span class="val" id="s-total">—</span><span class="lbl">Liquidations actives</span></div>
  <div class="stat-item"><span class="val" id="s-liq">—</span><span class="lbl">Liquidations judiciaires</span></div>
  <div class="stat-item"><span class="val" id="s-dept">—</span><span class="lbl">Départements couverts</span></div>
  <div class="derniere-maj" id="maj">Mise à jour : chaque nuit</div>
</div>

<div class="main">
  <!-- Panneau gauche -->
  <div class="panel">
    <div class="panel-header">
      <div class="search-bar">
        <input type="text" id="search" placeholder="🔍  Ville, enseigne, activité..." oninput="filtrer()" />
      </div>
      <div class="filters">
        <select id="f-type" onchange="filtrer()">
          <option value="">Tous les types</option>
          <option value="Liquidation">Liquidation</option>
          <option value="Redressement">Redressement</option>
          <option value="Sauvegarde">Sauvegarde</option>
        </select>
        <select id="f-dept" onchange="filtrer()">
          <option value="">Tous les dép.</option>
        </select>
        <select id="f-score" onchange="filtrer()">
          <option value="">Toutes les affaires</option>
          <option value="5">⭐⭐⭐⭐⭐ Excellentes</option>
          <option value="4">⭐⭐⭐⭐+ Très bonnes</option>
        </select>
      </div>
      <div class="results-count" id="results-count">Chargement...</div>
    </div>

    <div class="liste" id="liste">
      <div class="loading"><div class="spinner"></div>Chargement des liquidations...</div>
    </div>

    <button class="btn-signaler" onclick="ouvrirModal()">
      📍 Signaler une liquidation près de chez moi
    </button>
  </div>

  <!-- Carte Leaflet -->
  <div id="carte"></div>
</div>

<!-- Modal signalement -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>📍 Signaler une liquidation</h3>
    <label>Nom du magasin *</label>
    <input type="text" id="sig-nom" placeholder="Ex: Boutique Mode Paris 15" />
    <label>Adresse</label>
    <input type="text" id="sig-adresse" placeholder="Ex: 12 rue de la Paix" />
    <label>Ville *</label>
    <input type="text" id="sig-ville" placeholder="Ex: Paris" />
    <label>Type d'activité</label>
    <input type="text" id="sig-activite" placeholder="Ex: Vêtements femme" />
    <label>Informations supplémentaires</label>
    <textarea id="sig-desc" placeholder="Dates prévues, remises observées..."></textarea>
    <div class="modal-btns">
      <button class="btn-annuler" onclick="fermerModal()">Annuler</button>
      <button class="btn-envoyer" onclick="envoyerSignalement()">Envoyer le signalement</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// CONFIG — à remplacer par vos vraies clés Supabase
// ============================================================
const SUPABASE_URL = 'https://pbovulzjngjhmhvayzzi.supabase.co/rest/v1/';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBib3Z1bHpqbmdqaG1odmF5enppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NDY3MTcsImV4cCI6MjA5NjIyMjcxN30.95jyWDxPSXg8ENAKl-n7KRT9g6jOaZG8nWISq3zwklk';

// Coordonnées approx. par département pour la carte
const COORDS_DEPT = {
  '01':[46.2,5.2],'02':[49.5,3.6],'03':[46.3,3.4],'04':[44.1,6.2],'05':[44.7,6.3],
  '06':[43.7,7.2],'07':[44.7,4.6],'08':[49.7,4.7],'09':[42.9,1.6],'10':[48.3,4.1],
  '11':[43.2,2.4],'12':[44.4,2.6],'13':[43.5,5.4],'14':[49.1,-0.4],'15':[45.0,2.6],
  '16':[45.7,0.2],'17':[45.8,-0.7],'18':[47.1,2.4],'19':[45.3,1.9],'20':[42.0,9.0],
  '21':[47.3,4.8],'22':[48.4,-2.9],'23':[46.0,2.2],'24':[45.1,0.7],'25':[47.2,6.0],
  '26':[44.7,5.0],'27':[49.1,1.1],'28':[48.4,1.5],'29':[48.2,-4.0],'30':[44.0,4.2],
  '31':[43.6,1.4],'32':[43.6,0.6],'33':[44.8,-0.6],'34':[43.6,3.9],'35':[48.1,-1.7],
  '36':[46.8,1.6],'37':[47.4,0.7],'38':[45.2,5.7],'39':[46.7,5.6],'40':[43.9,-0.8],
  '41':[47.6,1.3],'42':[45.5,4.2],'43':[45.0,3.9],'44':[47.3,-1.6],'45':[47.9,2.2],
  '46':[44.6,1.7],'47':[44.4,0.6],'48':[44.5,3.5],'49':[47.5,-0.6],'50':[49.1,-1.3],
  '51':[49.0,4.4],'52':[48.1,5.1],'53':[48.1,-0.8],'54':[48.7,6.2],'55':[49.2,5.4],
  '56':[47.7,-2.8],'57':[49.1,6.2],'58':[47.1,3.5],'59':[50.5,3.1],'60':[49.4,2.4],
  '61':[48.6,0.1],'62':[50.5,2.6],'63':[45.8,3.1],'64':[43.3,-0.4],'65':[43.1,0.2],
  '66':[42.7,2.9],'67':[48.6,7.7],'68':[47.8,7.3],'69':[45.8,4.8],'70':[47.6,6.1],
  '71':[46.8,4.5],'72':[47.9,0.2],'73':[45.6,6.4],'74':[46.0,6.4],'75':[48.9,2.3],
  '76':[49.5,1.1],'77':[48.6,2.9],'78':[48.8,1.9],'79':[46.6,-0.3],'80':[49.9,2.3],
  '81':[43.9,2.1],'82':[44.0,1.4],'83':[43.5,6.1],'84':[44.1,5.1],'85':[46.7,-1.3],
  '86':[46.6,0.3],'87':[45.9,1.2],'88':[48.2,6.5],'89':[47.8,3.6],'90':[47.6,6.9],
  '91':[48.6,2.2],'92':[48.9,2.2],'93':[48.9,2.5],'94':[48.8,2.5],'95':[49.1,2.1]
};

let carte, markers = [], allData = [], filteredData = [];

// ============================================================
// INIT CARTE
// ============================================================
function initCarte() {
  carte = L.map('carte').setView([46.8, 2.3], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap | Données BODACC',
    maxZoom: 18
  }).addTo(carte);
}

// ============================================================
// CHARGEMENT DONNÉES SUPABASE
// ============================================================
async function chargerDonnees() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/liquidations?select=*&est_retail=eq.true&actif=eq.true&order=date_parution.desc&limit=500`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    allData = await res.json();

    // Stats
    await chargerStats();

    // Filtres départements
    const depts = [...new Set(allData.map(r => r.departement).filter(Boolean))].sort();
    const sel = document.getElementById('f-dept');
    depts.forEach(d => {
      const o = document.createElement('option');
      o.value = d; o.textContent = 'Dép. ' + d;
      sel.appendChild(o);
    });

    filtrer();
  } catch(e) {
    document.getElementById('liste').innerHTML = `<div class="loading">❌ Erreur de chargement.<br><small>${e.message}</small></div>`;
  }
}

async function chargerStats() {
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/stats_site?select=*`,
      { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    const stats = (await res.json())[0];
    if (stats) {
      document.getElementById('s-total').textContent = stats.total || '—';
      document.getElementById('s-liq').textContent = stats.liquidations || '—';
      document.getElementById('s-dept').textContent = stats.departements_couverts || '—';
      if (stats.derniere_annonce) {
        document.getElementById('maj').textContent = 'Dernière annonce : ' + new Date(stats.derniere_annonce).toLocaleDateString('fr-FR');
      }
    }
  } catch(e) { console.log('Stats non disponibles'); }
}

// ============================================================
// FILTRES
// ============================================================
function filtrer() {
  const search = document.getElementById('search').value.toLowerCase();
  const type   = document.getElementById('f-type').value;
  const dept   = document.getElementById('f-dept').value;
  const score  = parseInt(document.getElementById('f-score').value) || 0;

  filteredData = allData.filter(r => {
    const matchSearch = !search || (r.nom||'').toLowerCase().includes(search) || (r.ville||'').toLowerCase().includes(search) || (r.activite||'').toLowerCase().includes(search);
    const matchType   = !type  || (r.type_procedure||'').includes(type);
    const matchDept   = !dept  || r.departement === dept;
    const matchScore  = !score || r.score_affaire >= score;
    return matchSearch && matchType && matchDept && matchScore;
  });

  document.getElementById('results-count').textContent = `${filteredData.length} résultat${filteredData.length > 1 ? 's' : ''}`;
  afficherListe();
  afficherMarqueurs();
}

// ============================================================
// LISTE
// ============================================================
function afficherListe() {
  const liste = document.getElementById('liste');
  if (!filteredData.length) {
    liste.innerHTML = '<div class="loading">😕 Aucun résultat</div>';
    return;
  }
  liste.innerHTML = filteredData.slice(0, 100).map(r => `
    <div class="card" id="card-${r.id}" onclick="zoomSur(${r.id})">
      <div class="card-top">
        <div class="card-nom">${r.nom}</div>
        <span class="badge ${badgeClass(r.type_procedure)}">${shortType(r.type_procedure)}</span>
      </div>
      <div class="card-ville">📍 ${r.ville}${r.departement ? ' (' + r.departement + ')' : ''}</div>
      <div class="card-activite">${r.activite || '—'}</div>
      <div class="card-bottom">
        <span class="card-date">${fmtDate(r.date_parution)}</span>
        <span class="etoiles">${'⭐'.repeat(r.score_affaire || 3)}</span>
      </div>
    </div>
  `).join('');
}

// ============================================================
// MARQUEURS CARTE
// ============================================================
function afficherMarqueurs() {
  markers.forEach(m => carte.removeLayer(m));
  markers = [];

  filteredData.forEach(r => {
    const coords = COORDS_DEPT[r.departement];
    if (!coords) return;

    // Léger décalage aléatoire pour éviter la superposition
    const lat = coords[0] + (Math.random() - 0.5) * 0.3;
    const lng = coords[1] + (Math.random() - 0.5) * 0.3;

    const couleur = r.type_procedure?.includes('Liquidation') ? '#C0392B'
      : r.type_procedure?.includes('Redressement') ? '#E67E22' : '#27AE60';

    const icon = L.divIcon({
      html: `<div style="width:12px;height:12px;border-radius:50%;background:${couleur};border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>`,
      className: '', iconSize: [12, 12], iconAnchor: [6, 6]
    });

    const m = L.marker([lat, lng], { icon })
      .addTo(carte)
      .bindPopup(`
        <div class="popup-nom">${r.nom}</div>
        <div class="popup-detail">
          📍 ${r.ville} (${r.departement})<br>
          🏷️ ${r.type_procedure}<br>
          🛍️ ${r.activite || '—'}<br>
          📅 ${fmtDate(r.date_parution)}<br>
          ${'⭐'.repeat(r.score_affaire || 3)}
        </div>
        <a class="popup-link" href="${r.url_bodacc}" target="_blank">Voir l'annonce officielle →</a>
      `);

    m._liquidation_id = r.id;
    markers.push(m);
  });
}

function zoomSur(id) {
  const r = filteredData.find(x => x.id === id);
  if (!r) return;
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + id)?.classList.add('active');
  const coords = COORDS_DEPT[r.departement];
  if (coords) {
    carte.setView([coords[0], coords[1]], 10);
    markers.find(m => m._liquidation_id === id)?.openPopup();
  }
}

// ============================================================
// MODAL SIGNALEMENT
// ============================================================
function ouvrirModal()  { document.getElementById('modal').classList.add('show'); }
function fermerModal()  { document.getElementById('modal').classList.remove('show'); }

async function envoyerSignalement() {
  const nom     = document.getElementById('sig-nom').value.trim();
  const ville   = document.getElementById('sig-ville').value.trim();
  if (!nom || !ville) { alert('Merci de remplir au moins le nom et la ville.'); return; }

  try {
    await fetch(`${SUPABASE_URL}/rest/v1/signalements`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nom, ville,
        adresse:   document.getElementById('sig-adresse').value.trim(),
        activite:  document.getElementById('sig-activite').value.trim(),
        description: document.getElementById('sig-desc').value.trim()
      })
    });
    alert('✅ Merci ! Votre signalement a été envoyé et sera vérifié avant publication.');
    fermerModal();
  } catch(e) {
    alert('❌ Erreur lors de l\'envoi : ' + e.message);
  }
}

// ============================================================
// UTILITAIRES
// ============================================================
function badgeClass(t = '') {
  if (t.includes('Liquidation')) return 'liq';
  if (t.includes('Redressement')) return 'red';
  return 'sauv';
}
function shortType(t = '') {
  if (t.includes('Liquidation')) return 'Liquidation';
  if (t.includes('Redressement')) return 'Redressement';
  return 'Sauvegarde';
}
function fmtDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
  catch { return d; }
}

// ============================================================
// DÉMARRAGE
// ============================================================
initCarte();
chargerDonnees();
</script>
</body>
</html>
