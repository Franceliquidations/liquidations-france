-- ============================================================
-- SCHÉMA BASE DE DONNÉES — Liquidations France
-- À coller dans l'éditeur SQL de Supabase
-- ============================================================

-- Table principale des liquidations
CREATE TABLE IF NOT EXISTS liquidations (
  id               BIGSERIAL PRIMARY KEY,
  bodacc_id        TEXT UNIQUE NOT NULL,
  nom              TEXT NOT NULL,
  ville            TEXT,
  code_postal      TEXT,
  departement      TEXT,
  type_procedure   TEXT,          -- Liquidation judiciaire / Redressement / Sauvegarde
  date_parution    DATE,
  activite         TEXT,
  est_retail       BOOLEAN DEFAULT false,
  score_affaire    INTEGER DEFAULT 3, -- 1 à 5 étoiles
  url_bodacc       TEXT,
  verifie          BOOLEAN DEFAULT false,
  source           TEXT DEFAULT 'BODACC',
  signale_par      TEXT,          -- 'communauté' si signalement utilisateur
  actif            BOOLEAN DEFAULT true,
  created_at       TIMESTAMPTZ DEFAULT NOW(),
  updated_at       TIMESTAMPTZ DEFAULT NOW()
);

-- Table meta (infos système)
CREATE TABLE IF NOT EXISTS meta (
  cle    TEXT PRIMARY KEY,
  valeur TEXT
);

-- Table signalements communautaires (Phase 2)
CREATE TABLE IF NOT EXISTS signalements (
  id          BIGSERIAL PRIMARY KEY,
  nom         TEXT NOT NULL,
  adresse     TEXT,
  ville       TEXT NOT NULL,
  code_postal TEXT,
  activite    TEXT,
  description TEXT,
  contact     TEXT,
  statut      TEXT DEFAULT 'en_attente', -- en_attente / approuve / rejete
  created_at  TIMESTAMPTZ DEFAULT NOW()
);

-- Index pour accélérer les recherches
CREATE INDEX IF NOT EXISTS idx_liquidations_ville       ON liquidations(ville);
CREATE INDEX IF NOT EXISTS idx_liquidations_departement ON liquidations(departement);
CREATE INDEX IF NOT EXISTS idx_liquidations_type        ON liquidations(type_procedure);
CREATE INDEX IF NOT EXISTS idx_liquidations_date        ON liquidations(date_parution DESC);
CREATE INDEX IF NOT EXISTS idx_liquidations_retail      ON liquidations(est_retail);
CREATE INDEX IF NOT EXISTS idx_liquidations_actif       ON liquidations(actif);

-- Accès lecture publique (pour le site)
ALTER TABLE liquidations ENABLE ROW LEVEL SECURITY;
ALTER TABLE signalements ENABLE ROW LEVEL SECURITY;

CREATE POLICY "Lecture publique liquidations"
  ON liquidations FOR SELECT
  USING (actif = true AND est_retail = true);

CREATE POLICY "Insertion signalements"
  ON signalements FOR INSERT
  WITH CHECK (true);

-- Vue pour les statistiques du site
CREATE OR REPLACE VIEW stats_site AS
SELECT
  COUNT(*)                                            AS total,
  COUNT(*) FILTER (WHERE type_procedure = 'Liquidation judiciaire') AS liquidations,
  COUNT(*) FILTER (WHERE type_procedure = 'Redressement judiciaire') AS redressements,
  COUNT(DISTINCT departement)                         AS departements_couverts,
  MAX(date_parution)                                  AS derniere_annonce
FROM liquidations
WHERE actif = true AND est_retail = true;
